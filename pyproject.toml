[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "crowbrain"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "torch", "scikit-learn", "matplotlib", "pyyaml"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
